<!DOCTYPE html>
<html>
    <head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>LED方向幕シミュレーター</title>
	<link rel="stylesheet" href="style.css">
	<link rel="manifest" href="manifest.json">
	<link rel="stylesheet" href="leaflet/leaflet.css">
    </head>

	<script>
	if ("serviceWorker" in navigator) {
	    window.addEventListener("load", () => {
	        navigator.serviceWorker.register("./sw.js");
	    });
	}
	</script>

    <body>

		<div id="loading" hidden>
			<span>Loading</span><span class="loadingDots"></span>
		</div>

    	<header id="tittle">
        	<h1>LED方向幕シミュレーター</h1>
    	</header>

		<!-- ホーム画面（車両選択画面） -->
		<div id="vehicleSelector">
			<!-- ホーム画面用 Bluetooth設定UI -->
			<div class="esp32Setting" style="margin-bottom: 20px; padding: 15px; background: #eef6ff; border: 1px solid #007bff; border-radius: 8px;">
				<h2 style="margin-top: 0; color: #007bff; font-size: 16px;">Bluetooth (ESP32) 接続設定</h2>
				<button type="button" onclick="connectBluetooth()" style="width: 100%; padding: 12px; font-size: 15px; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer;">Bluetooth接続</button>
				<p class="transferStatus" style="margin-top: 10px; margin-bottom: 0; font-size: 13px; font-weight: bold; color: #333;"></p>
			</div>

			<label id="vehicleSelectMethodLabel" for="vehicleSelectMethod">車両の選択方法</label>
			<select id="vehicleSelectMethod">
				<option value="list">リストから選択</option>
				<option value="grid">地図上から選択</option>
			</select>
			<div id="vehicleSelect" class="selectGroup"></div>
			<div id="map" hidden>
				<div id="linePanel" hidden>
					<button id="closeLinePanel">×</button>
					<h2 id="selectedLineName"></h2>

					<div id="lineVehicleList"></div>
				</div>
			</div>

			<!-- LED設定UI -->
			<div id="ledSettings">
				<h3 style="margin-top: 0;">LED設定</h3>
				<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
					<label>
						LEDの物理幅
						<input type="number" id="hardwareWidth" value="192" min="64" max="256" style="width: 100%; padding: 6px; box-sizing: border-box;" onchange="if(typeof triggerAutoTransfer === 'function') triggerAutoTransfer()">
					</label>
					<label>
						LED全体の明るさ: <span id="val-hw-bright">8</span>
						<input type="range" id="hwBrightness" min="1" max="50" step="1" value="8" style="width: 100%;" oninput="document.getElementById('val-hw-bright').innerText=this.value; if(typeof triggerAutoTransfer === 'function') triggerAutoTransfer();">
					</label>
					<label>
						色の明るさ (Software): <span id="val-brightness">1.0</span>
						<input type="range" id="softBrightness" min="0.1" max="2.0" step="0.1" value="1.0" style="width: 100%;" oninput="document.getElementById('val-brightness').innerText=this.value; if(typeof triggerAutoTransfer === 'function') triggerAutoTransfer();">
					</label>
					<label>
						ガンマ補正: <span id="val-gamma">2.5</span>
						<input type="range" id="gammaCorrection" min="0.1" max="3.0" step="0.1" value="2.5" style="width: 100%;" oninput="document.getElementById('val-gamma').innerText=this.value; if(typeof triggerAutoTransfer === 'function') triggerAutoTransfer();">
					</label>
				</div>
			</div>
		</div>
		<div id="cacheNotice" hidden>
    キャッシュの保存が完了しました
		</div>

		<!-- シミュレーター画面 -->
		<div id="simulator" hidden>
			<div class="container">
				<aside id="sidebar">
					<div id="setTime">
						<div id="jaTime" class="timeSetting" hidden>
							<span>日本語:</span>
							<div class="numberInput">
								<button type="button" class="minus">−</button>
								<input type="number" value="3" min="0.1" step="0.1">
								<button type="button" class="plus">＋</button>
							</div>
							<span>秒</span>
						</div>
						<div id="enTime" class="timeSetting" hidden>
							<span>英語:</span>
							<div class="numberInput">
								<button type="button" class="minus">−</button>
								<input type="number" value="2" min="0.1" step="0.1">
								<button type="button" class="plus">＋</button>
							</div>
							<span>秒</span>
						</div>
						<div id="infoTime" class="timeSetting" hidden>
							<span>案内:</span>
							<div class="numberInput">
								<button type="button" class="minus">−</button>
								<input type="number" value="2" min="0.1" step="0.1">
								<button type="button" class="plus">＋</button>
							</div>
							<span>秒</span>
						</div>
						<div id="carNumberTime" class="timeSetting" hidden>
							<span>号車:</span>
							<div class="numberInput">
								<button type="button" class="minus">−</button>
								<input type="number" value="2" min="0.1" step="0.1">
								<button type="button" class="plus">＋</button>
							</div>
							<span>秒</span>
						</div>
					</div>
					
					<div id="buttonGroup">
						<div id="typeGroup">
							<label id="type" class="displayLabel">種別:なし</label>
							<div id="typeButtons" class="buttonGroup"></div>
						</div>
						<div id="destinationGroup">
							<label id="destination" class="displayLabel">行先:なし</label>
							<div id="destinationButtons" class="buttonGroup"></div>
						</div>
						<div id="informationGroup">
							<label id="information" class="displayLabel">案内:なし</label>
							<div id="informationButtons" class="buttonGroup"></div>
						</div>
						<div id="information2Group">
							<label id="information2" class="displayLabel">案内2:なし</label>
							<div id="information2Buttons" class="buttonGroup"></div>
						</div>
						<div id="lineGroup">
							<label id="line" class="displayLabel">路線名:なし</label>
							<div id="lineButtons" class="buttonGroup"></div>
						</div>
						<div id="nextModeGroup">
							<label id="nextMode" class="displayLabel">次駅:なし</label>
							<div id="nextModeButtons" class="buttonGroup"></div>
						</div>
						<div id="carNumberGroup">
							<label id="carNumber" class="displayLabel">号車:なし</label>
							<div id="carNumberButtons" class="buttonGroup"></div>
						</div>
					</div>

					<div id="verticalSlide">
						<button id="displayVerticalSlideBtn">縦スライド設定を表示する</button>
						<div id="verticalSlideCheckbox" hidden>
							<label id="verticalSlideLabel1">
								<input type="checkbox" id="verticalSlideCheck" checked> 画面切替時に縦スライドする
							</label>
							<label id="verticalSlideLabel2">
								<input type="checkbox" id="verticalSlideCheck2" checked> 画面切替時に縦スライドする（2）
							</label>
							<label id="choppyScrollLabel">
								<input type="checkbox" id="choppyScrollCheck"> スクロールをカクカクさせる
							</label>
						</div>
					</div>
					<div id="ledAgingGroup">
						<label id="ledAgingLabel">
							<input type="checkbox" id="ledAgingCheck"> LEDを劣化させる
						</label>
						<div id="setLedAgingLebel" hidden>
							<label id="ledAgingLebelLabel" for="ledAgingLebel">LEDの劣化度合い: <span id="ledAgingLebelValue">3</span></label>
							<input type="range" id="ledAgingLebel" min="1" max="7" value="3" step="1">
						</div>
					</div>
					
					<div id="scroll" hidden>
						<label>
							<input type="checkbox" id="scrollCheck">
							スクロール
						</label>
						<textarea id="scrollText" hidden></textarea>
						<button id="startScrollBtn" hidden>スクロール更新</button>
					</div>

					<div id="explanation">
						<h2>車両説明</h2>
						<div id="explanationLabel"></div>
					</div>
					
					<div id="referenceSite" hidden>
						<h2>参考サイト</h2>
						<label>一部の再現ドットは、以下のサイトに掲載されている再現画像を参考にドット打ちさせていただきました。</label>
						<div id="referenceSiteLink"></div>
					</div>
					
					<!-- シミュレーター画面用 Bluetooth設定UI -->
					<div class="esp32Setting" style="margin-top: 15px; margin-bottom: 15px; padding: 12px; background: #eef6ff; border: 1px solid #007bff; border-radius: 8px;">
						<h2 style="margin-top: 0; font-size: 14px; color: #007bff;">Bluetooth設定</h2>
						<button type="button" onclick="connectBluetooth()" style="width: 100%; padding: 10px; font-size: 14px; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Bluetooth接続</button>
						<p class="transferStatus" style="margin-top: 8px; margin-bottom: 0; font-size: 12px; font-weight: bold; color: #333;"></p>
					</div>

					<button id="vehicleSelectButton">車両選択に戻る</button>
				</aside>

				<div id="resizer"></div>

				<main>
					<div class="ledFrame">
						<canvas id="led" width="895" height="223"></canvas>
					</div>
				</main>
        	</div>
		</div>

        <footer id="status">
        </footer>

	<script src="js/state.js"></script>
	<script src="js/constants.js"></script>
	<script src="js/dom.js"></script>
	<script src="js/json.js"></script>
	<script src="js/buttons.js"></script>
	<script src="js/display.js"></script>
	<script src="js/render.js"></script>
	<script src="js/vehicle.js"></script>
    <script src="js/script.js"></script>
	<script src="js/transfer.js"></script>
	<script src="leaflet/leaflet.js"></script>
	<script src="js/map.js"></script>
	<div id="debugConsole">
    <div>デバッグコンソール</div>
    <button onclick="document.getElementById('debugLog').textContent = ''">ログを消去</button>
    <pre id="debugLog">表示テスト成功</pre>
</div>
    </body>
</html>
